<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page.title }}</title>
<link rel="icon" href="{{ '/assets/icon.png' | relative_url }}">
<meta name="color-scheme" content="light dark">
<style>
:root{
  --ink:#1D1D1F; --ink2:rgba(29,29,31,.72); --ink3:rgba(29,29,31,.54); --hair:rgba(29,29,31,.07);
  --paper:rgba(255,255,255,.98); --edge:rgba(255,255,255,.55); --cream:#F2E8D4;
  --s1:#2F5079; --s2:#3A5F8D; --s3:#46699A; --s4:#6A8EB8; --s5:#8BA7C8; --s6:#7898C0; --s7:#B3BDC8; --s8:#C6CCD2; --s9:#B8BFC7;
}
@media (prefers-color-scheme: dark){:root{
  --ink:rgb(245,245,247); --ink2:rgba(255,255,255,.75); --ink3:rgba(255,255,255,.40); --hair:rgba(255,255,255,.09);
  --paper:rgba(43,43,47,.97); --edge:rgba(255,255,255,.08);
  --s1:#0A1424; --s2:#0E1A2E; --s3:#101E34; --s4:#1A2C48; --s5:#24385A; --s6:#1E3150; --s7:#2A3A52; --s8:#33425A; --s9:#2C3B52;
}}
*{box-sizing:border-box}
html{background:var(--s5)}
body{margin:0;min-height:100vh;color:var(--ink);
  font:15px/19px -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(60% 45% at 0% 0%,var(--s1),transparent 70%),
    radial-gradient(60% 45% at 50% 0%,var(--s2),transparent 70%),
    radial-gradient(60% 45% at 100% 0%,var(--s3),transparent 70%),
    radial-gradient(60% 45% at 0% 50%,var(--s4),transparent 70%),
    radial-gradient(60% 45% at 50% 50%,var(--s5),transparent 70%),
    radial-gradient(60% 45% at 100% 50%,var(--s6),transparent 70%),
    radial-gradient(60% 45% at 0% 100%,var(--s7),transparent 70%),
    radial-gradient(60% 45% at 50% 100%,var(--s8),transparent 70%),
    radial-gradient(60% 45% at 100% 100%,var(--s9),transparent 70%),
    linear-gradient(180deg,var(--s2),var(--s5) 55%,var(--s8));
  background-attachment:fixed}
.wrap{max-width:720px;margin:0 auto;padding:max(48px,env(safe-area-inset-top)) 16px 64px}
header{text-align:center;color:#fff;margin-bottom:28px}
header a{color:inherit;text-decoration:none}
header img{width:64px;height:64px;border-radius:15px;display:block;margin:0 auto 14px;box-shadow:0 1px 0 rgba(255,255,255,.25) inset}
h1{font-family:"New York",ui-serif,Georgia,serif;font-weight:500;font-size:30px;line-height:36px;margin:0}
header p{margin:8px 0 0;color:rgba(255,255,255,.82)}
nav{display:flex;gap:8px;justify-content:center;margin-top:16px}
nav a{padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font-size:14px;line-height:18px}
nav a.on{background:var(--cream);color:#1D1D1F}
.paper{background:var(--paper);border-radius:24px;padding:8px 22px 22px;box-shadow:inset 0 0 0 .5px var(--edge)}
.paper h2{font-size:17px;line-height:22px;font-weight:500;margin:24px 0 8px}
.paper p,.paper li{color:var(--ink2)}
.paper strong{color:var(--ink);font-weight:500}
.paper ul{padding-left:20px;margin:8px 0}
.paper li{margin:6px 0}
.paper a{color:var(--ink)}
.updated{font-size:12px;color:var(--ink3);margin:14px 0 0}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:18px;margin:8px 0;display:block;overflow-x:auto}
th,td{text-align:left;vertical-align:top;padding:10px 12px 10px 0;border-bottom:1px solid var(--hair);color:var(--ink2)}
th{color:var(--ink);font-weight:500}
footer{text-align:center;color:rgba(255,255,255,.75);font-size:12px;margin-top:20px}
footer a{color:#fff}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a href="{{ '/' | relative_url }}"><img src="{{ '/assets/icon.png' | relative_url }}" alt=""></a>
  <h1>{{ page.heading | default: page.title }}</h1>
  {% if page.lead %}<p>{{ page.lead }}</p>{% endif %}
  <nav><a href="{{ '/terms' | relative_url }}" {% if page.permalink == '/terms' %}class="on"{% endif %}>Terms</a><a href="{{ '/privacy' | relative_url }}" {% if page.permalink == '/privacy' %}class="on"{% endif %}>Privacy</a></nav>
</header>
<main class="paper">
{{ content }}
</main>
<footer>Hermia · <a href="mailto:hermia@moloman.dev">hermia@moloman.dev</a></footer>
</div>
</body>
</html>
